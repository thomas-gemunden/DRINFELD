name: GAP test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GAP
        uses: gap-actions/setup-gap@v2
        with:
          GAPVERSION: "4.13.0"
          GAP_PKGS_TO_BUILD: "io"

      - name: Install HAP
        run: gap -q -b -c 'LoadPackage("hap"); QUIT;'

      - name: Make runner executable
        run: chmod +x ./run_tests.sh

      - name: Run regression suite
        run: ./run_tests.sh
        env:
          FAST: "1"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test_*.log
          if-no-files-found: ignore
